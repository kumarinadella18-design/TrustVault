
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Delete Document</title>
</head>
<body>

    <h2>Delete Document</h2>

    <p>Are you sure you want to delete this document?</p>

    <h3>{{ document.title }}</h3>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'document_list' %}">Cancel</a>

</body>
</html>
